<!DOCTYPE html>
<html lang="ru" data-theme="atelier" data-color-scheme="dark" data-fx="tactile">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="description" content="Ulduz — офлайн-тренажёр для подготовки к выпускному экзамену ГЭЦ Азербайджана (DİM Buraxılış / Аттестат) по математике, русскому, английскому и азербайджанскому языкам." />
  <meta name="theme-color" id="theme-color-meta" content="#0C0C0E" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ulduz" />
  <title>Ulduz — Тренажёр экзамена ДИМ (Аттестат)</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png" />

  <!-- Apply initial archival edition, color-scheme, motion tier & lang before first paint (zero FOUC) -->
  <script>
    (function () {
      var LEGACY = {
        voshod: 'atelier',
        intel: 'prism',
        nvidia: 'pulse',
        amd: 'monolith',
        master: 'eclipse',
        light: 'atelier',
        dark: 'atelier'
      };
      var META = {
        atelier:  { tc: '#0C0C0E', cs: 'dark'  },
        prism:    { tc: '#080D18', cs: 'dark'  },
        pulse:    { tc: '#0C0C0D', cs: 'dark'  },
        monolith: { tc: '#0F0D0E', cs: 'dark'  },
        eclipse:  { tc: '#ECECEB', cs: 'light' }
      };
      var FX = { minimal: 1, tactile: 1, webgl: 1 };
      try {
        var raw = localStorage.getItem('ulduz_state_v1');
        var parsed = raw ? JSON.parse(raw) : null;
        var rawTheme = parsed && parsed.theme;
        var theme = META[rawTheme] ? rawTheme : (LEGACY[rawTheme] || 'atelier');
        var fx = parsed && FX[parsed.fxMode] ? parsed.fxMode : 'tactile';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-color-scheme', META[theme].cs);
        document.documentElement.setAttribute('data-fx', fx);
        var tc = document.getElementById('theme-color-meta');
        if (tc) tc.setAttribute('content', META[theme].tc);
        if (parsed && (parsed.lang === 'az' || parsed.lang === 'ru')) {
          document.documentElement.lang = parsed.lang;
        }
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'atelier');
        document.documentElement.setAttribute('data-color-scheme', 'dark');
        document.documentElement.setAttribute('data-fx', 'tactile');
      }
    })();
  </script>

  <!-- Local vendored typography, display fonts & KaTeX (100% offline) -->
  <link rel="stylesheet" href="./vendor/fonts/fonts.css" />
  <link rel="stylesheet" href="./vendor/fonts/theme-fonts.css" />
  <link rel="stylesheet" href="./vendor/katex/katex.min.css" />
  <!-- Factory Records Archival Catalog Design System: Tokens -> Primitives -> Layouts -> 5 Editions -->
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/primitives.css" />
  <link rel="stylesheet" href="./css/styles.css" />
  <link rel="stylesheet" href="./css/themes.css" />
</head>
<body>
  <a href="#app-main" class="skip-link" id="skip-link">Перейти к основному содержимому</a>

  <!-- Subtle Edition Structural Layer (dry matte ground by default; edition blueprint/stripe overlays) -->
  <div class="theme-backdrop" aria-hidden="true">
    <div class="theme-backdrop__grid"></div>
  </div>

  <div class="app-shell">
    <header id="app-header" class="app-header"></header>
    <div id="fac-impulse-bar" class="fac-impulse-bar" aria-hidden="true"></div>
    <main id="app-main" class="app-main" tabindex="-1"></main>
    <footer id="app-footer" class="app-footer"></footer>
    <nav id="mobile-bottom-nav" class="mobile-bottom-nav" aria-label="Основная навигация"></nav>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <div id="theme-modal-host"></div>
  </div>

  <!-- Local vendored KaTeX runtime -->
  <script src="./vendor/katex/katex.min.js"></script>
  <script src="./vendor/katex/auto-render.min.js"></script>
  <!-- Application entry point (ES Modules, zero build step) -->
  <script type="module" src="./js/app/main.js"></script>
</body>
</html>
