[package]
name = "ulduz"
version = "1.0.0"
description = "Ulduz — DİM 11th-grade Attestat exam trainer (Azerbaijan)"
authors = ["Ulduz Contributors"]
edition = "2021"

[lib]
name = "ulduz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-haptics = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
